# =============================================================================
# ERP AI Platform - Monitoring Services
# Observability stack: Prometheus, Grafana, Tempo, Loki.
# =============================================================================
# Start with:
#   docker compose -f compose.base.yml -f compose.infrastructure.yml -f compose.monitoring.yml --profile infrastructure --profile monitoring up

services:
  # ===========================================================================
  # Metrics Exporters
  # ===========================================================================

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: erpai-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgres://${POSTGRES_USER:-erpai}:${POSTGRES_PASSWORD:-erpai_dev_password}@postgres:5432/${POSTGRES_DB:-erpai_platform}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - erpai-data-network
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: erpai-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://:${REDIS_PASSWORD:-erpai_dev_password}@redis:6379"
    ports:
      - "9121:9121"
    networks:
      - erpai-data-network
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # Metrics Collection
  # ===========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: erpai-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/docker/prometheus/alerting_rules.yml:/etc/prometheus/alerting_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - erpai-monitoring-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ===========================================================================
  # Alertmanager
  # ===========================================================================

  alertmanager:
    image: prom/alertmanager:latest
    container_name: erpai-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    volumes:
      - alertmanager_data:/alertmanager
      - ./infrastructure/docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - erpai-monitoring-network
    depends_on:
      prometheus:
        condition: service_healthy
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # Visualization
  # ===========================================================================

  grafana:
    image: grafana/grafana:latest
    container_name: erpai-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - erpai-monitoring-network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # Distributed Tracing
  # ===========================================================================

  tempo:
    image: grafana/tempo:latest
    container_name: erpai-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "3200:3200"  # Tempo Query
    volumes:
      - ./infrastructure/docker/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    networks:
      - erpai-monitoring-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ===========================================================================
  # Log Aggregation
  # ===========================================================================

  loki:
    image: grafana/loki:latest
    container_name: erpai-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/docker/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - erpai-monitoring-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: gradle
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Build application
        run: ./gradlew bootJar -x test
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: erpai/platform:${{ github.sha }},erpai/platform:latest
          cache-from: type=registry,ref=erpai/platform:buildcache
          cache-to: type=registry,ref=erpai/platform:buildcache,mode=max

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v7
      
      - name: Deploy to staging
        run: |
          kubectl set image deployment/gateway gateway=erpai/platform:${{ github.sha }} -n erpai-platform-staging
          kubectl rollout status deployment/gateway -n erpai-platform-staging --timeout=300s

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v7
      
      - name: Deploy to production
        run: |
          kubectl set image deployment/gateway gateway=erpai/platform:${{ github.sha }} -n erpai-platform
          kubectl rollout status deployment/gateway -n erpai-platform --timeout=300s

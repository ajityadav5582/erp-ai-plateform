# =============================================================================
# ERP AI Platform - Alertmanager Configuration
# =============================================================================

global:
  resolve_timeout: 5m
  smtp_smarthost: 'localhost:1025'
  smtp_from: 'alertmanager@erpai.local'

# =============================================================================
# Templates
# =============================================================================

templates:
  - '/etc/alertmanager/templates/*.tmpl'

# =============================================================================
# Route Tree
# =============================================================================

route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-alerts'

# =============================================================================
# Receivers
# =============================================================================

receivers:
  - name: 'default'
    email_configs:
      - to: 'ops@erpai.local'
        subject: '[ERP AI] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
            Alert: {{ .Annotations.summary }}
            Description: {{ .Annotations.description }}
            Severity: {{ .Labels.severity }}
            Service: {{ .Labels.service }}
          {{ end }}

  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@erpai.local'
        subject: '[ERP AI CRITICAL] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
            CRITICAL ALERT: {{ .Annotations.summary }}
            Description: {{ .Annotations.description }}
            Service: {{ .Labels.service }}
            Started at: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}

  - name: 'warning-alerts'
    email_configs:
      - to: 'ops@erpai.local'
        subject: '[ERP AI WARNING] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
            Warning: {{ .Annotations.summary }}
            Description: {{ .Annotations.description }}
            Service: {{ .Labels.service }}
          {{ end }}

# =============================================================================
# Inhibition Rules
# =============================================================================

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  - source_match:
      alertname: 'ServiceDown'
    target_match:
      alertname: 'HighLatency'
    equal: ['service']

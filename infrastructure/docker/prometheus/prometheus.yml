global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'erpai-local'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gateway'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/actuator/prometheus'

  - job_name: 'keycloak'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/realms/erpai/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['host.docker.internal:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['host.docker.internal:9121']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9308']

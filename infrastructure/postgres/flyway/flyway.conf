# =============================================================================
# ERP AI Platform - Flyway Configuration
# Database migration management for all microservices
# =============================================================================

# =============================================================================
# Common Configuration
# =============================================================================
flyway.url=jdbc:postgresql://localhost:5432/
flyway.user=erpai
flyway.password=${POSTGRES_PASSWORD:-erpai_dev_password}
flyway.schemas=public
flyway.defaultSchema=public
flyway.createSchemas=true
flyway.cleanDisabled=true
flyway.baselineOnMigrate=true
flyway.baselineVersion=1
flyway.validateOnMigrate=true
flyway.outOfOrder=false
flyway.placeholderReplacement=true
flyway.locations=filesystem:infrastructure/postgres/flyway/{service}

# =============================================================================
# Logging
# =============================================================================
flyway.loggers=console
flyway.infoEnabled=true
flyway.debug=false

# =============================================================================
# Callbacks (optional)
# =============================================================================
# flyway.callbacks=filesystem:infrastructure/postgres/flyway/callbacks

# =============================================================================
# Kafka KRaft Mode Configuration
# =============================================================================

# Node identification
node.id=1
process.roles=broker,controller
controller.quorum.voters=1@kafka:9098

# Network configuration
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9098,PLAINTEXT_HOST://0.0.0.0:29092
advertised.listeners=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER

# Security
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST_ADVERTISED:PLAINTEXT

# Log configuration
log.dirs=/var/lib/kafka/data
log.retention.hours=168
log.retention.check.interval.ms=300000
log.segment.bytes=1073741824
log.segment.ms=604800000

# Topic configuration
num.partitions=12
default.replication.factor=1
auto.create.topics.enable=true
delete.topic.enable=true

# Transaction configuration
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# Group configuration
group.initial.rebalance.delay.ms=0

# Performance tuning
socket.send.buffer.bytes=1048576
socket.receive.buffer.bytes=1048576
socket.request.max.bytes=104857600
max.partition.fetch.bytes=1048576
fetch.max.bytes=52428800
message.max.bytes=1048576

# Replication
replica.fetch.max.bytes=1048576
replica.fetch.response.max.bytes=10485760
replica.fetch.wait.max.ms=1000
replica.fetch.min.bytes=1

# Metrics
metric.reporters=
metrics.recording.level=INFO

# =============================================================================
# ERP AI Platform - Redis Configuration
# Enterprise-grade Redis configuration for caching, session management,
# and distributed locking.
# =============================================================================

# -----------------------------------------------------------------------------
# Network
# -----------------------------------------------------------------------------
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------
daemonize no
supervised docker
pidfile /var/run/redis.pid
loglevel notice
logfile ""
databases 16
always-show-logo no

# -----------------------------------------------------------------------------
# Snapshotting (RDB)
# -----------------------------------------------------------------------------
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# -----------------------------------------------------------------------------
# Persistence (AOF)
# -----------------------------------------------------------------------------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-timestamp-enabled no

# -----------------------------------------------------------------------------
# Memory Management
# -----------------------------------------------------------------------------
# Memory limit and eviction policy are set via command line arguments
# --maxmemory 256mb
# --maxmemory-policy allkeys-lru

# -----------------------------------------------------------------------------
# Replication
# -----------------------------------------------------------------------------
# Not configured for standalone deployment
# replicaof <masterip> <masterport>
# replica-serve-stale-data yes
# replica-read-only yes
# repl-diskless-sync no
# repl-diskless-sync-delay 5

# -----------------------------------------------------------------------------
# Security
# -----------------------------------------------------------------------------
# Password authentication is set via command line: --requirepass <password>
# ACL can be configured for fine-grained access control in production
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command DEBUG ""

# -----------------------------------------------------------------------------
# Clients
# -----------------------------------------------------------------------------
maxclients 10000

# -----------------------------------------------------------------------------
# Client Output Buffer Limits
# -----------------------------------------------------------------------------
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# -----------------------------------------------------------------------------
# Latency Monitoring
# -----------------------------------------------------------------------------
latency-monitor-threshold 100

# -----------------------------------------------------------------------------
# Slow Log
# -----------------------------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128

# -----------------------------------------------------------------------------
# Event Notification
# -----------------------------------------------------------------------------
notify-keyspace-events ""

# -----------------------------------------------------------------------------
# Advanced Configuration
# -----------------------------------------------------------------------------
hash-max-zzl-entries 128
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 1mb
stream-node-max-entries 100
stream-node-max-iterations 100
activerehash-yes
hz 10
dynamic-hz yes

# =============================================================================
# ERP AI Platform - API Gateway Service Configuration
# Unified API entry point exposing a single port to the frontend.
# =============================================================================

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      global-cors:
        corsConfigurations:
          '[/**]':
            allowed-origin-patterns:
              - "http://localhost:3000"
              - "http://localhost:8080"
              - "http://127.0.0.1:8080"
              - "https://*.erpai.internal"
            allowed-methods:
              - "GET"
              - "POST"
              - "PUT"
              - "PATCH"
              - "DELETE"
              - "OPTIONS"
            allowed-headers:
              - "*"
            exposed-headers:
              - "Authorization"
              - "Location"
              - "X-Tenant-ID"
              - "X-Correlation-Id"
              - "X-Request-Id"
            allow-credentials: true
            max-age: 3600
      routes:
        # ------------------------------------------------------------------
        # Inventory Service - Category, product, stock management.
        # MUST precede the identity catch-all so /api/v1/inventory/** is not
        # swallowed by the broader /api/v1/** predicate.
        # ------------------------------------------------------------------
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URI:http://inventory-service:8083}
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: GET,POST,PUT,DELETE,PATCH

        # ------------------------------------------------------------------
        # Procurement Service - Branch purchase requisitions, approval chain.
        # MUST precede the identity catch-all so /api/v1/procurement/** is not
        # swallowed by the broader /api/v1/** predicate.
        # ------------------------------------------------------------------
        - id: procurement-service
          uri: ${PROCUREMENT_SERVICE_URI:http://procurement-service:8084}
          predicates:
            - Path=/api/v1/procurement/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: GET,POST,PUT,DELETE,PATCH

        # ------------------------------------------------------------------
        # Sales Service - Customers, sales orders, deliveries, IRD tax
        # invoices, customer receipts, sales returns and the sales register.
        # MUST precede the identity catch-all so /api/v1/sales/** is not
        # swallowed by the broader /api/v1/** predicate.
        # ------------------------------------------------------------------
        - id: sales-service
          uri: ${SALES_SERVICE_URI:http://sales-service:8085}
          predicates:
            - Path=/api/v1/sales/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: GET,POST,PUT,DELETE,PATCH

        # ------------------------------------------------------------------
        # POS Service - Registers, cashier sessions, checkout, quick items
        # and IRD CBMS real-time bill reporting.
        # MUST precede the identity catch-all so /api/v1/pos/** is not
        # swallowed by the broader /api/v1/** predicate.
        # ------------------------------------------------------------------
        - id: pos-service
          uri: ${POS_SERVICE_URI:http://pos-service:8086}
          predicates:
            - Path=/api/v1/pos/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: GET,POST,PUT,DELETE,PATCH

        # ------------------------------------------------------------------
        # Reports Service - VAT Return (Annex 10), financial and regulatory reports.
        # MUST precede the identity catch-all so /api/v1/reports/** is not
        # swallowed by the broader /api/v1/** predicate.
        # ------------------------------------------------------------------
        - id: reports-service
          uri: ${REPORTS_SERVICE_URI:http://reports-service:8090}
          predicates:
            - Path=/api/v1/reports/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: GET,POST,PUT,DELETE,PATCH

        # ------------------------------------------------------------------
        # Identity Service - User, role, permission, branch, department,
        # province/district management, authentication, onboarding, company,
        # fiscal years, resources, etc.
        #
        # Placed AFTER the specific inventory/tenant routes and given a broad
        # catch-all predicate so EVERY identity endpoint is reachable (new
        # controllers do not need to be registered here individually).
        # ------------------------------------------------------------------
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URI:http://identity-service:8082}
          predicates:
            - Path=/api/v1/identity/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: GET,POST,PUT,DELETE,PATCH

        # ------------------------------------------------------------------
        # Swagger OpenAPI Documentation Routes
        # Rewrite and proxy /v3/api-docs/<service> requests from the Swagger UI
        # aggregator on port 8080 to the downstream services' /v3/api-docs.
        # ------------------------------------------------------------------
        - id: inventory-docs
          uri: ${INVENTORY_SERVICE_URI:http://inventory-service:8083}
          predicates:
            - Path=/v3/api-docs/inventory/**, /v3/api-docs/inventory
          filters:
            - RewritePath=/v3/api-docs/inventory(/?.*), /v3/api-docs$1

        - id: procurement-docs
          uri: ${PROCUREMENT_SERVICE_URI:http://procurement-service:8084}
          predicates:
            - Path=/v3/api-docs/procurement/**, /v3/api-docs/procurement
          filters:
            - RewritePath=/v3/api-docs/procurement(/?.*), /v3/api-docs$1

        - id: sales-docs
          uri: ${SALES_SERVICE_URI:http://sales-service:8085}
          predicates:
            - Path=/v3/api-docs/sales/**, /v3/api-docs/sales
          filters:
            - RewritePath=/v3/api-docs/sales(/?.*), /v3/api-docs$1

        - id: pos-docs
          uri: ${POS_SERVICE_URI:http://pos-service:8086}
          predicates:
            - Path=/v3/api-docs/pos/**, /v3/api-docs/pos
          filters:
            - RewritePath=/v3/api-docs/pos(/?.*), /v3/api-docs$1

        - id: identity-docs
          uri: ${IDENTITY_SERVICE_URI:http://identity-service:8082}
          predicates:
            - Path=/v3/api-docs/identity/**, /v3/api-docs/identity
          filters:
            - RewritePath=/v3/api-docs/identity(/?.*), /v3/api-docs$1

        - id: reports-docs
          uri: ${REPORTS_SERVICE_URI:http://reports-service:8090}
          predicates:
            - Path=/v3/api-docs/reports/**, /v3/api-docs/reports
          filters:
            - RewritePath=/v3/api-docs/reports(/?.*), /v3/api-docs$1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateways
  endpoint:
    health:
      show-details: always

# Gateway-specific configuration
erp:
  security:
    jwt:
      # The gateway only routes; it does not validate tokens itself. Each
      # downstream service validates the access token with the shared filter,
      # and the servlet-side filter must not be installed in this reactive app.
      enabled: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    urls:
      - name: Identity Service
        url: /v3/api-docs/identity
      - name: Inventory Service
        url: /v3/api-docs/inventory
      - name: Procurement Service
        url: /v3/api-docs/procurement
      - name: Sales Service
        url: /v3/api-docs/sales
      - name: POS Service
        url: /v3/api-docs/pos
      - name: Reports Service
        url: /v3/api-docs/reports

logging:
  level:
    com.erp.platform.gateway: INFO
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO

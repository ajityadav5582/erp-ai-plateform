# =============================================================================
# ERP AI Platform - API Gateway: Local Development Profile
# Activated when SPRING_PROFILES_ACTIVE=local
# =============================================================================

spring:
  main:
    lazy-initialization: true
  cloud:
    gateway:
      global-cors:
        corsConfigurations:
          '[/**]':
            allowed-origin-patterns:
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
              - "http://localhost:8080"
              - "http://127.0.0.1:8080"
            allowed-methods:
              - "GET"
              - "POST"
              - "PUT"
              - "PATCH"
              - "DELETE"
              - "OPTIONS"
            allowed-headers:
              - "*"
            exposed-headers:
              - "Authorization"
              - "Location"
              - "X-Tenant-ID"
              - "X-Correlation-Id"
              - "X-Request-Id"
            allow-credentials: true
            max-age: 3600
      routes:
        # Inventory Service (localhost:8083) - MUST precede identity catch-all
        - id: inventory-service-local
          uri: ${INVENTORY_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: GET,POST,PUT,DELETE,PATCH

        # Procurement Service (localhost:8084) - MUST precede identity catch-all
        - id: procurement-service-local
          uri: ${PROCUREMENT_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/procurement/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: GET,POST,PUT,DELETE,PATCH

        # Sales Service (localhost:8085) - MUST precede identity catch-all
        - id: sales-service-local
          uri: ${SALES_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/sales/**,/api/v1/ird/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: GET,POST,PUT,DELETE,PATCH

        # POS Service (localhost:8086) - MUST precede identity catch-all
        - id: pos-service-local
          uri: ${POS_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/pos/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: GET,POST,PUT,DELETE,PATCH

        # Reports Service (localhost:8090) - MUST precede identity catch-all
        - id: reports-service-local
          uri: ${REPORTS_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/api/v1/reports/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: GET,POST,PUT,DELETE,PATCH

        # Identity Service (localhost:8081) - broad catch-all so every
        # identity endpoint (companies, branches, departments, roles,
        # permissions, users, auth, onboarding, etc.) is reachable.
        - id: identity-service-local
          uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/identity/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: GET,POST,PUT,DELETE,PATCH

        # Swagger OpenAPI Documentation Routes (Local)
        - id: inventory-docs-local
          uri: ${INVENTORY_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/v3/api-docs/inventory/**, /v3/api-docs/inventory
          filters:
            - RewritePath=/v3/api-docs/inventory(/?.*), /v3/api-docs$1

        - id: procurement-docs-local
          uri: ${PROCUREMENT_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/v3/api-docs/procurement/**, /v3/api-docs/procurement
          filters:
            - RewritePath=/v3/api-docs/procurement(/?.*), /v3/api-docs$1

        - id: sales-docs-local
          uri: ${SALES_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/v3/api-docs/sales/**, /v3/api-docs/sales
          filters:
            - RewritePath=/v3/api-docs/sales(/?.*), /v3/api-docs$1

        - id: pos-docs-local
          uri: ${POS_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/v3/api-docs/pos/**, /v3/api-docs/pos
          filters:
            - RewritePath=/v3/api-docs/pos(/?.*), /v3/api-docs$1

        - id: identity-docs-local
          uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/v3/api-docs/identity/**, /v3/api-docs/identity
          filters:
            - RewritePath=/v3/api-docs/identity(/?.*), /v3/api-docs$1

        - id: reports-docs-local
          uri: ${REPORTS_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/v3/api-docs/reports/**, /v3/api-docs/reports
          filters:
            - RewritePath=/v3/api-docs/reports(/?.*), /v3/api-docs$1

        # Health check passthrough
        - id: health-check-local
          uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/actuator/health
          filters:
            - StripPrefix=0

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    urls:
      - name: Identity Service
        url: /v3/api-docs/identity
      - name: Inventory Service
        url: /v3/api-docs/inventory
      - name: Procurement Service
        url: /v3/api-docs/procurement
      - name: Sales Service
        url: /v3/api-docs/sales
      - name: POS Service
        url: /v3/api-docs/pos
      - name: Reports Service
        url: /v3/api-docs/reports

logging:
  level:
    com.erp.platform.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
    org.springframework.web: DEBUG

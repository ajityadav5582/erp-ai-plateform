plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

group = 'com.erp.platform'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile) {
    options.compilerArgs.removeAll { it == '-Xlint:all' }
    options.compilerArgs.addAll(['-Xlint:-processing'])
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    // Spring Core
    api 'org.springframework:spring-context'
    api 'org.springframework:spring-web'
    api 'org.springframework.boot:spring-boot-starter-web'

    // Spring Security (compileOnly - consumers provide their own stack)
    compileOnly 'org.springframework.boot:spring-boot-starter-security'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Common platform libraries
    implementation project(':libraries:common-core')
    implementation project(':libraries:common-security')
    implementation project(':libraries:common-data')

    // JPA (for shared DocumentSequence)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Inventory public contracts
    implementation project(':business:inventory:interfaces')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:-processing"
}

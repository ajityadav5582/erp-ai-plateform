plugins {
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management'
    id 'java-library'
}

group = 'com.erp.platform'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url "https://repo.spring.io/milestone" }
    maven { url "https://repo.spring.io/snapshot" }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    // Common libraries
    implementation project(':libraries:common-core')
    implementation project(':libraries:common-data')
    implementation project(':libraries:common-events')
    implementation project(':libraries:common-security')

    // Platform modules
    implementation project(':platform:tenant')

    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Database
    implementation "org.postgresql:postgresql:${postgresqlVersion}"
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-database-postgresql:${flywayVersion}"

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // MapStruct
    implementation "org.mapstruct:mapstruct:1.5.5.Final"
    annotationProcessor "org.mapstruct:mapstruct-processor:1.5.5.Final"

    // Security - JWT (access & refresh token issuance/validation)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Security - Spring Security for JWT authentication filter chain
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Security - Password hashing (BCrypt)
    implementation 'org.springframework.security:spring-security-crypto'

    // Utilities
    implementation "org.apache.commons:commons-lang3:${commonsLangVersion}"
    implementation "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Testing
    testImplementation project(':libraries:common-testing')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:-processing"
}

bootRun {
    environment = [
        'POSTGRES_HOST': 'localhost',
        'POSTGRES_PORT': '5434',
        'POSTGRES_DB': 'erpai_platform',
        'POSTGRES_USER': 'erpai',
        'POSTGRES_PASSWORD': 'erpai_dev_password',
        'DB_USERNAME': 'erpai',
        'DB_PASSWORD': 'erpai_dev_password',
        'SPRING_PROFILES_ACTIVE': 'local'
    ]
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

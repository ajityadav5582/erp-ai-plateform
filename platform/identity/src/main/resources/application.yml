spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:-localhost}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-erpai_platform}
    username: ${DB_USERNAME:-${POSTGRES_USER:-erpai}}
    password: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-erpai_dev_password}}
    driver-class-name: org.postgresql.Driver
  jpa:
    generate-ddl: ${SPRING_JPA_GENERATE_DDL:true}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "com.erp.platform.*"

server:
  port: ${SERVER_PORT:8082}

auth:
  jwt:
    # HMAC-SHA secret used to sign/verify JWTs. MUST be at least 32 bytes (256 bits).
    # In production this must be injected from a secrets manager, never committed.
    secret: ${JWT_SECRET:jwt-secret-key-change-me-in-production-32b}
    issuer: erp-ai-platform-identity
    # Access token lifetime (milliseconds). Default 15 minutes.
    access-token-expiry-ms: 900000
    # Refresh token lifetime (milliseconds). Default 7 days.
    refresh-token-expiry-ms: 604800000
  password-reset:
    # Reset token lifetime (milliseconds). Default 1 hour.
    token-expiry-ms: 3600000
    # Maximum consecutive failed login attempts before temporary lockout.
    max-failed-login-attempts: 5
    # Temporary lockout duration after exceeding max attempts (milliseconds). Default 15 minutes.
    lockout-duration-ms: 900000
    # When true the raw reset token is returned in the forgot-password response (dev only).
    # In production this MUST be false and the token delivered out-of-band (email).
    return-token-in-response: true

# Identity is the token issuer and installs its own JwtAuthenticationFilter,
# so the shared read-only token validator must stay off here.
erp:
  security:
    jwt:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

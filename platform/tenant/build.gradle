plugins {
    id 'java-library'
}

group = 'com.erp.platform'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url "https://repo.spring.io/milestone" }
    maven { url "https://repo.spring.io/snapshot" }
}

dependencies {
    // Common platform libraries (consumed by identity as a project dependency)
    implementation project(':libraries:common-core')
    implementation project(':libraries:common-data')
    implementation project(':libraries:common-events')
    implementation project(':libraries:common-security')

    // Utilities
    implementation "org.apache.commons:commons-lang3:${commonsLangVersion}"
    implementation "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:-processing"
}

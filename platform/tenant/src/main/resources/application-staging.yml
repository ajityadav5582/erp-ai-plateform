# =============================================================================
# ERP AI Platform - Tenant Service: Staging Profile
# Activated when SPRING_PROFILES_ACTIVE=staging
# =============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-erpai_platform}
    username: ${DB_USERNAME:-${POSTGRES_USER:-erpai}}
    password: ${DB_PASSWORD:-${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.erp.platform.tenant: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

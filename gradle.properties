# ERP AI Platform - Gradle Properties
# Enterprise-grade configuration

# Project
org.gradle.project.group=com.erpai.platform
org.gradle.project.version=0.1.0-SNAPSHOT

# Java
org.gradle.java.home=/Users/ajityadav/Library/Java/JavaVirtualMachines/openjdk-24.0.1/Contents/Home

# Performance
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true

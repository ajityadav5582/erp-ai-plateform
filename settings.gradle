/*
 * ERP AI Platform - Root Settings
 * Enterprise-grade multi-tenant SaaS platform foundation
 */

pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://repo.spring.io/milestone" }
        maven { url "https://repo.spring.io/snapshot" }
    }
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        maven { url "https://repo.spring.io/milestone" }
        maven { url "https://repo.spring.io/snapshot" }
        maven { url "https://packages.jetbrains.team/maven/p/kt/team/teamcity" }
    }
}

rootProject.name = "erp-ai-platform"


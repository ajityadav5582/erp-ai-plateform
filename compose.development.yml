# =============================================================================
# ERP AI Platform - Development Overrides
# Development-specific configurations and tooling.
# =============================================================================
# Start with:
#   docker compose -f compose.base.yml -f compose.infrastructure.yml -f compose.development.yml --profile development up

services:
  # ===========================================================================
  # PostgreSQL Development Overrides
  # ===========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: erpai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erpai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-erpai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erpai_dev_password}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_duration=on"
      - "-c"
      - "log_min_messages=info"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_temp_files=0"
      - "-c"
      - "log_line_prefix='%t [%p-%l] %q%u@%d '"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_wal:/var/lib/postgresql/wal
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - erpai-data-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erpai} -d ${POSTGRES_DB:-erpai_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    profiles: ["development"]

  # ===========================================================================
  # Flyway Development Overrides
  # ===========================================================================

  flyway:
    image: flyway/flyway:10.12-alpine
    container_name: erpai-flyway
    restart: unless-stopped
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/
      FLYWAY_USER: ${POSTGRES_USER:-erpai}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-erpai_dev_password}
      FLYWAY_SCHEMAS: public
      FLYWAY_DEFAULT_SCHEMA: public
      FLYWAY_CREATE_SCHEMAS: "true"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
      FLYWAY_VALIDATE_ON_MIGRATE: "true"
      FLYWAY_OUT_OF_ORDER: "false"
      FLYWAY_PLACEHOLDER_REPLACEMENT: "true"
      FLYWAY_LOCATIONS: "filesystem:infrastructure/postgres/flyway/{service}"
      FLYWAY_GROUP: "false"
    volumes:
      - ./infrastructure/postgres/flyway:/flyway/sql:ro
    networks:
      - erpai-data-network
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["development"]
    command: >
      -connectRetries=5
      -baselineOnMigrate=true
      -baselineVersion=1
      migrate

  # ===========================================================================
  # Redis Development Overrides
  # ===========================================================================

  redis:
    image: redis:7-alpine
    container_name: erpai-redis
    restart: unless-stopped
    user: redis
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-erpai_dev_password}
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --save 60 1
      --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - erpai-data-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-erpai_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    profiles: ["development"]

  # ===========================================================================
  # Kafka Development Overrides
  # ===========================================================================

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: erpai-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9098
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST_ADVERTISED:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9098,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - erpai-data-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    profiles: ["development"]

  # ===========================================================================
  # Schema Registry Development Overrides
  # ===========================================================================

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: erpai-schema-registry
    restart: unless-stopped
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_DEBUG: "true"
    ports:
      - "8081:8081"
    networks:
      - erpai-data-network
    depends_on:
      kafka:
        condition: service_healthy
    profiles: ["development"]

  # ===========================================================================
  # Keycloak Development Overrides
  # ===========================================================================

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: erpai-keycloak
    restart: unless-stopped
    command: start-dev --import-realm --log-level=DEBUG
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: ${KC_DB:-dev-mem}
      KC_HTTP_RELATIVE_PATH: /
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-DEBUG}
      KC_HOSTNAME: ${KC_HOSTNAME:-keycloak.localhost}
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infrastructure/docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - erpai-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    profiles: ["development"]

  # ===========================================================================
  # MinIO Development Overrides
  # ===========================================================================

  minio:
    image: minio/minio:latest
    container_name: erpai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001" --certs-dir /certs
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - erpai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    profiles: ["development"]

  # ===========================================================================
  # Kafka UI Development Overrides
  # ===========================================================================

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: erpai-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: erpai-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONFIGS_SECURITY_PROTOCOL: PLAINTEXT
    ports:
      - "8082:8080"
    networks:
      - erpai-data-network
    depends_on:
      kafka:
        condition: service_healthy
    profiles: ["development"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # Development Tools
  # ===========================================================================

  mailhog:
    image: mailhog/mailhog:latest
    container_name: erpai-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    volumes:
      - mailhog_data:/data
    networks:
      - erpai-network
    profiles: ["development"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: erpai-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@erpai.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - erpai-network
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["development"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mailhog_data:
    driver: local
  pgadmin_data:
    driver: local

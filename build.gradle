/*
 * ERP AI Platform - Root Build Configuration
 * Enterprise-grade multi-tenant SaaS platform foundation
 */

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0" apply false
    id "com.github.ben-manes.versions" version "0.51.0" apply false
    id "org.sonarqube" version "6.0.1.5171" apply false
    id "io.spring.dependency-management" version "1.1.5" apply false
}

allprojects {
    group = "com.erpai.platform"
    version = "0.1.0-SNAPSHOT"

    repositories {
        mavenCentral()
        maven { url "https://repo.spring.io/milestone" }
        maven { url "https://repo.spring.io/snapshot" }
    }
}

subprojects {
    apply plugin: "java-library"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.compilerArgs.addAll(["-Xlint:all", "-Xlint:-processing", "-Werror"])
    }
}

ext {
    // Spring Boot
    springBootVersion = "3.3.4"
    springVersion = "6.1.12"

    // Jakarta EE
    jakartaValidationVersion = "3.0.2"
    jakartaPersistenceVersion = "3.1.0"

    // Jackson
    jacksonVersion = "2.17.2"

    // Apache Commons
    commonsLangVersion = "3.15.0"

    // Lombok
    lombokVersion = "1.18.32"

    // Database
    h2Version = "2.3.232"
    flywayVersion = "10.15.0"
    postgresqlVersion = "42.7.3"

    // Observability
    micrometerVersion = "1.13.3"
}

subprojects {
    apply plugin: "io.spring.dependency-management"

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        }
    }

    dependencies {
        annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
        annotationProcessor "org.springframework.data:spring-data-jpa"
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

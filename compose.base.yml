# =============================================================================
# ERP AI Platform - Docker Compose Base
# Shared networks, volumes, and environment configuration.
# =============================================================================

# =============================================================================
# Shared Infrastructure
# =============================================================================

networks:
  erpai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  erpai-data-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
  erpai-monitoring-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24

volumes:
  postgres_data:
    driver: local
  postgres_wal:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  keycloak_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  tempo_data:
    driver: local
  loki_data:
    driver: local
  alertmanager_data:
    driver: local
  mailhog_data:
    driver: local
  pgadmin_data:
    driver: local

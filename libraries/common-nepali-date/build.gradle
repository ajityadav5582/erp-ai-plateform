/*
 * Reusable Bikram Sambat (BS) / Nepali date support.
 *
 * Deliberately dependency-light:
 *  - core converter + value types are pure JDK (no compile deps)
 *  - JPA auto-sync helper uses compileOnly jakarta.persistence-api
 *  - no coupling to identity / inventory / procurement
 */

plugins {
    id 'java-library'
}

group = 'com.erp.platform'
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // JPA is only needed by the optional DualDateColumns helper at runtime.
    // Every Spring Boot service in this repo already provides it.
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // Tests exercise the JPA annotations on DualDateColumns, so the API must be
    // on the test compile classpath as well (compileOnly is not inherited).
    testCompileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

plugins {
    id 'java-library'
}

group = 'com.erp.platform'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot (version managed by Spring Boot BOM)
    implementation 'org.springframework.boot:spring-boot-starter'

    // Common Core
    implementation project(':libraries:common-core')

    // Jakarta Validation (version managed by Spring Boot BOM)
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'org.hibernate.validator:hibernate-validator'
    annotationProcessor 'jakarta.validation:jakarta.validation-api'
    annotationProcessor 'org.hibernate.validator:hibernate-validator'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:-processing"
}

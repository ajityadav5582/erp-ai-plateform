plugins {
    id 'java-library'
}

group = 'com.erp.platform'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    // Common Core
    api project(':libraries:common-core')

    // Spring Data JPA (version managed by Spring Boot BOM)
    api 'org.springframework.data:spring-data-jpa'
    api 'org.springframework:spring-orm'

    // JPA / Hibernate (version managed by Spring Boot BOM)
    api 'jakarta.persistence:jakarta.persistence-api'
    api 'org.hibernate.orm:hibernate-core'

    // Flyway
    api "org.flywaydb:flyway-core:${flywayVersion}"
    api "org.flywaydb:flyway-database-postgresql:${flywayVersion}"

    // PostgreSQL
    api "org.postgresql:postgresql:${postgresqlVersion}"

    // Utilities
    api "org.apache.commons:commons-lang3:${commonsLangVersion}"
    api "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Annotation Processors
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // Test
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.springframework:spring-test"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
}


tasks.withType(Test) {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:-processing"
}

# =============================================================================
# ERP AI Platform - Local Development Compose
# Minimal setup for fast local development: PostgreSQL + Application only.
# =============================================================================
# This is the default Compose file used by `docker compose up`. It intentionally
# excludes the heavier infrastructure (Kafka, Redis, Keycloak, MinIO, monitoring
# stack, MailHog, pgAdmin) so local development starts quickly with minimal
# resource usage. The Spring Boot application runs with the `local` profile and
# applies its own Flyway database migrations on startup.
#
# Quick start:
#   docker compose up                 # foreground
#   docker compose up -d              # detached
#   docker compose down               # stop
#   docker compose down -v            # stop and remove volumes
#
# Need the full stack (Kafka, Redis, Keycloak, MinIO, monitoring, etc.)?
#   Use the modular files instead:
#     docker compose -f compose.base.yml -f compose.infrastructure.yml up
#     docker compose -f compose.base.yml -f compose.infrastructure.yml -f compose.monitoring.yml --profile monitoring up
#   Or the helper scripts:
#     ./scripts/docker/start.sh
#     ./scripts/docker/local-dev.sh
# =============================================================================

services:
  # ===========================================================================
  # Database
  # ===========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: erpai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erpai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-erpai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erpai_dev_password}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_duration=on"
      - "-c"
      - "log_min_messages=info"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_temp_files=0"
      - "-c"
      - "log_line_prefix='%t [%p-%l] %q%u@%d '"
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_wal:/var/lib/postgresql/wal
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - erpai-data-network
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/postgresql/.s.PGSQL.5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ===========================================================================
  # API Gateway - Single entry point for the frontend
  # Exposes port 8080 and routes to downstream services.
  # ===========================================================================

  gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.runtime
      target: gateway
      args:
        SERVICE_NAME: api-gateway
        JAR_PATH: platform/gateway/build/libs
    container_name: erpai-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${GATEWAY_PORT:-8080}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-erpai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-erpai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erpai_dev_password}
      IDENTITY_SERVICE_URI: ${IDENTITY_SERVICE_URI:-http://identity-service:8082}
      INVENTORY_SERVICE_URI: ${INVENTORY_SERVICE_URI:-http://inventory-service:8083}
      # Present for symmetry with the other two. Without it the gateway still finds
      # the right default inside application-local.yml, but the service is then
      # invisible here - and this block is where you look to find out what a
      # deployed gateway can actually reach.
      PROCUREMENT_SERVICE_URI: ${PROCUREMENT_SERVICE_URI:-http://procurement-service:8084}
      # Sales Service is routed to, so the gateway must be able to reach it.
      SALES_SERVICE_URI: ${SALES_SERVICE_URI:-http://sales-service:8085}
      # POS Service is routed to, so the gateway must be able to reach it.
      POS_SERVICE_URI: ${POS_SERVICE_URI:-http://pos-service:8086}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus,gateways
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_HEALTH_LIVENESS_STATE_ENABLED: "true"
      MANAGEMENT_HEALTH_READINESS_STATE_ENABLED: "true"
    ports:
      - "${GATEWAY_PORT:-8080}:${GATEWAY_PORT:-8080}"
    volumes:
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    depends_on:
      identity-service:
        condition: service_started
      inventory-service:
        condition: service_started
      # procurement-service is routed to, so the gateway must not come up healthy
      # while the service behind its route is still starting. Its absence here was
      # the same omission as the missing route: procurement was added to the
      # platform and the gateway was never told.
      procurement-service:
        condition: service_started
      # sales-service is routed to for the same reason as procurement above.
      sales-service:
        condition: service_started
      # pos-service is routed to for the same reason as procurement above.
      pos-service:
        condition: service_started
    networks:
      - erpai-data-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${GATEWAY_PORT:-8080}/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ===========================================================================
  # Identity Service - User, role, permission, authentication
  # ===========================================================================

  identity-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.runtime
      target: identity
      args:
        SERVICE_NAME: identity-service
        JAR_PATH: platform/identity/build/libs
    container_name: erpai-identity
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${IDENTITY_PORT:-8082}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-erpai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-erpai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erpai_dev_password}
      JWT_SECRET: ${JWT_SECRET:-jwt-secret-key-change-me-in-production-32b}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_HEALTH_LIVENESS_STATE_ENABLED: "true"
      MANAGEMENT_HEALTH_READINESS_STATE_ENABLED: "true"
    ports:
      - "${IDENTITY_PORT:-8082}:${IDENTITY_PORT:-8082}"
    volumes:
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erpai-data-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${IDENTITY_PORT:-8082}/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ===========================================================================
  # Inventory Service - Category, product, stock management
  # ===========================================================================

  inventory-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.runtime
      target: inventory
      args:
        SERVICE_NAME: inventory-service
        JAR_PATH: business/inventory/application/build/libs
    container_name: erpai-inventory
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${INVENTORY_PORT:-8083}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-erpai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-erpai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erpai_dev_password}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_HEALTH_LIVENESS_STATE_ENABLED: "true"
      MANAGEMENT_HEALTH_READINESS_STATE_ENABLED: "true"
    ports:
      - "${INVENTORY_PORT:-8083}:${INVENTORY_PORT:-8083}"
    volumes:
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erpai-data-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${INVENTORY_PORT:-8083}/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ===========================================================================
  # Procurement Service - Branch purchase requisitions, approval chain,
  # requisition-to-purchase-order traceability
  # ===========================================================================

  procurement-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.runtime
      target: procurement
      args:
        SERVICE_NAME: procurement-service
        JAR_PATH: business/procurement/application/build/libs
    container_name: erpai-procurement
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${PROCUREMENT_PORT:-8084}
      # Where Procurement reaches Inventory to post stock movements (hexagonal
      # port's HTTP adapter). Defaults to the in-network service address.
      INVENTORY_SERVICE_URI: ${INVENTORY_SERVICE_URI:-http://inventory-service:8083}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-erpai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-erpai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erpai_dev_password}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_HEALTH_LIVENESS_STATE_ENABLED: "true"
      MANAGEMENT_HEALTH_READINESS_STATE_ENABLED: "true"
    ports:
      - "${PROCUREMENT_PORT:-8084}:${PROCUREMENT_PORT:-8084}"
    volumes:
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erpai-data-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PROCUREMENT_PORT:-8084}/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ===========================================================================
  # Sales Service - Customers, sales orders, deliveries, IRD tax invoices,
  # customer receipts, sales returns and the sales register.
  # ===========================================================================

  sales-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.runtime
      target: sales
      args:
        SERVICE_NAME: sales-service
        JAR_PATH: business/sales/application/build/libs
    container_name: erpai-sales
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${SALES_PORT:-8085}
      # Where Sales reaches Inventory to post outbound stock issues (hexagonal
      # port's HTTP adapter). Defaults to the in-network service address.
      INVENTORY_SERVICE_URI: ${INVENTORY_SERVICE_URI:-http://inventory-service:8083}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-erpai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-erpai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erpai_dev_password}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_HEALTH_LIVENESS_STATE_ENABLED: "true"
      MANAGEMENT_HEALTH_READINESS_STATE_ENABLED: "true"
    ports:
      - "${SALES_PORT:-8085}:${SALES_PORT:-8085}"
    volumes:
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erpai-data-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${SALES_PORT:-8085}/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ===========================================================================
  # POS Service - Registers, cashier sessions, checkout, quick items and
  # IRD CBMS real-time bill reporting.
  # ===========================================================================

  pos-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.runtime
      target: pos
      args:
        SERVICE_NAME: pos-service
        JAR_PATH: business/pos/application/build/libs
    container_name: erpai-pos
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${POS_PORT:-8086}
      # Where POS reaches Inventory for item lookup (scan-to-price) and the
      # outbound stock-issue port (hexagonal ports' HTTP adapters). Defaults to
      # the in-network service address.
      INVENTORY_SERVICE_URI: ${INVENTORY_SERVICE_URI:-http://inventory-service:8083}
      # IRD CBMS real-time reporting. Disabled by default: pushes are simulated
      # as successful so the outbox flow can be exercised without credentials.
      IRD_CBMS_URL: ${IRD_CBMS_URL:-https://cbms.ird.gov.np/api}
      IRD_CBMS_USERNAME: ${IRD_CBMS_USERNAME:-}
      IRD_CBMS_PASSWORD: ${IRD_CBMS_PASSWORD:-}
      IRD_CBMS_ENABLED: ${IRD_CBMS_ENABLED:-false}
      IRD_CBMS_SELLER_PAN: ${IRD_CBMS_SELLER_PAN:-123456789}
      IRD_CBMS_MAX_RETRIES: ${IRD_CBMS_MAX_RETRIES:-5}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-erpai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-erpai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erpai_dev_password}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_HEALTH_LIVENESS_STATE_ENABLED: "true"
      MANAGEMENT_HEALTH_READINESS_STATE_ENABLED: "true"
    ports:
      - "${POS_PORT:-8086}:${POS_PORT:-8086}"
    volumes:
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    networks:
      - erpai-data-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${POS_PORT:-8086}/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

volumes:
  postgres_data:
    driver: local
  postgres_wal:
    driver: local

networks:
  erpai-data-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.0.0/16

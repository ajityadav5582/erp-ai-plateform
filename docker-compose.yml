# =============================================================================
# ERP AI Platform - Docker Compose
# Enterprise-grade local development environment
# =============================================================================
# This file provides backward compatibility by including all services.
# For modular usage, see:
#   - compose.base.yml
#   - compose.infrastructure.yml
#   - compose.monitoring.yml
#   - compose.development.yml
#
# Quick start (all services):
#   docker compose up
#
# Modular usage examples:
#   docker compose -f compose.base.yml -f compose.infrastructure.yml up
#   docker compose -f compose.base.yml -f compose.infrastructure.yml -f compose.monitoring.yml --profile monitoring up
#   docker compose -f compose.base.yml -f compose.infrastructure.yml -f compose.development.yml --profile development up

version: '3.9'

services:
  # ===========================================================================
  # Databases
  # ===========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: erpai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erpai_platform
      POSTGRES_USER: erpai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erpai_dev_password}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_duration=on"
      - "-c"
      - "log_min_messages=info"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_temp_files=0"
      - "-c"
      - "log_line_prefix='%t [%p-%l] %q%u@%d '"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_wal:/var/lib/postgresql/wal
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - erpai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erpai -d erpai_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  flyway:
    image: flyway/flyway:10.12-alpine
    container_name: erpai-flyway
    restart: unless-stopped
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/
      FLYWAY_USER: erpai
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-erpai_dev_password}
      FLYWAY_SCHEMAS: public
      FLYWAY_DEFAULT_SCHEMA: public
      FLYWAY_CREATE_SCHEMAS: "true"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
      FLYWAY_VALIDATE_ON_MIGRATE: "true"
      FLYWAY_OUT_OF_ORDER: "false"
      FLYWAY_PLACEHOLDER_REPLACEMENT: "true"
      FLYWAY_LOCATIONS: "filesystem:infrastructure/postgres/flyway/{service}"
      FLYWAY_GROUP: "false"
    volumes:
      - ./infrastructure/postgres/flyway:/flyway/sql:ro
    networks:
      - erpai-network
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      -connectRetries=5
      -baselineOnMigrate=true
      -baselineVersion=1
      migrate

  # ===========================================================================
  # Cache
  # ===========================================================================

  redis:
    image: redis:7-alpine
    container_name: erpai-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-erpai_dev_password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - erpai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Message Broker
  # ===========================================================================

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: erpai-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9098
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST_ADVERTISED:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9098,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - erpai-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===========================================================================
  # Schema Registry
  # ===========================================================================

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: erpai-schema-registry
    restart: unless-stopped
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_DEBUG: "true"
    ports:
      - "8081:8081"
    networks:
      - erpai-network
    depends_on:
      kafka:
        condition: service_healthy

  # ===========================================================================
  # Identity Provider
  # ===========================================================================

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: erpai-keycloak
    restart: unless-stopped
    command: start-dev --import-realm --log-level=DEBUG
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: dev-mem
      KC_HTTP_RELATIVE_PATH: /
      KC_LOG_LEVEL: DEBUG
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infrastructure/docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - erpai-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===========================================================================
  # Object Storage
  # ===========================================================================

  minio:
    image: minio/minio:latest
    container_name: erpai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001" --certs-dir /certs
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_REGION: us-east-1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - erpai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===========================================================================
  # Metrics Collection
  # ===========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: erpai-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - erpai-network

  # ===========================================================================
  # Visualization
  # ===========================================================================

  grafana:
    image: grafana/grafana:latest
    container_name: erpai-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - erpai-network
    depends_on:
      - prometheus

  # ===========================================================================
  # Distributed Tracing
  # ===========================================================================

  tempo:
    image: grafana/tempo:latest
    container_name: erpai-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "3200:3200"  # Tempo Query
    volumes:
      - ./infrastructure/docker/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    networks:
      - erpai-network

  # ===========================================================================
  # Log Aggregation
  # ===========================================================================

  loki:
    image: grafana/loki:latest
    container_name: erpai-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/docker/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - erpai-network

  # ===========================================================================
  # Development Tools
  # ===========================================================================

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: erpai-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@erpai.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - erpai-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  postgres_wal:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  keycloak_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  tempo_data:
    driver: local
  loki_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  erpai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

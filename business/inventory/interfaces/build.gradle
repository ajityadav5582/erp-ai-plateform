plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

group = 'com.erp.business.inventory'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url "https://repo.spring.io/milestone" }
    maven { url "https://repo.spring.io/snapshot" }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    // Common libraries - only what's needed for DTOs and interfaces
    api project(':libraries:common-core')
    api project(':libraries:common-data')
    api project(':libraries:common-events')

    // Validation for DTOs
    api 'jakarta.validation:jakarta.validation-api'

    // Lombok for DTOs
    api "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Testing
    testImplementation project(':libraries:common-testing')
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:-processing"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

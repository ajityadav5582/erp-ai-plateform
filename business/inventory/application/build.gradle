plugins {
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management'
    id 'java-library'
}

group = 'com.erp.business.inventory'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url "https://repo.spring.io/milestone" }
    maven { url "https://repo.spring.io/snapshot" }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    // Shared platform library (Phase 1 consolidation)
    implementation project(':platform:shared')
    // Domain module (pure domain entities)
    api project(':business:inventory:domain')

    // Interfaces module (public contracts)
    api project(':business:inventory:interfaces')

    // Common libraries
    api project(':libraries:common-core')
    api project(':libraries:common-data')
    implementation project(':libraries:common-events')
    implementation project(':libraries:common-security')
    implementation project(':libraries:common-nepali-date')

    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Required by @RequiresPermission / @RequiresRole, which are enforced by the
    // shared PermissionAspect in libraries:common-security. Without AOP on the
    // classpath those annotations compile, are silently ignored at runtime, and
    // every endpoint stays open to any authenticated caller - the worst possible
    // failure mode for a security control, because nothing reports it.
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Database
    implementation "org.postgresql:postgresql:${postgresqlVersion}"
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-database-postgresql:${flywayVersion}"

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // MapStruct
    implementation "org.mapstruct:mapstruct:1.5.5.Final"
    annotationProcessor "org.mapstruct:mapstruct-processor:1.5.5.Final"

    // Security - JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Security - Password hashing
    implementation 'org.springframework.security:spring-security-crypto'

    // Utilities
    implementation "org.apache.commons:commons-lang3:${commonsLangVersion}"
    implementation "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Testing
    testImplementation project(':libraries:common-testing')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Real PostgreSQL for the native report queries (GREATEST / EXTRACT / FILTER),
    // which H2 cannot run. Version comes from the Spring Boot BOM's testcontainers-bom.
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:-processing"
}

bootRun {
    environment = [
        'POSTGRES_HOST': 'localhost',
        'POSTGRES_PORT': '5434',
        'POSTGRES_DB': 'erpai_platform',
        'POSTGRES_USER': 'erpai',
        'POSTGRES_PASSWORD': 'erpai_dev_password',
        'DB_USERNAME': 'erpai',
        'DB_PASSWORD': 'erpai_dev_password',
        'SPRING_PROFILES_ACTIVE': 'local',
        'JWT_SECRET': 'jwt-secret-key-change-me-in-production-32b'
    ]
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

group = 'com.erp.business.inventory'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url "https://repo.spring.io/milestone" }
    maven { url "https://repo.spring.io/snapshot" }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    // Pure domain - no Spring dependencies
    api project(':libraries:common-data')
    api project(':libraries:common-nepali-date')
    api project(':libraries:common-events')

    // JPA annotations only (no Spring Data)
    api 'jakarta.persistence:jakarta.persistence-api'
    api 'org.hibernate.orm:hibernate-core'

    // Validation
    api 'jakarta.validation:jakarta.validation-api'

    // Utilities
    api "org.apache.commons:commons-lang3:${commonsLangVersion}"
    api "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // Testing
    testImplementation project(':libraries:common-testing')
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:-processing"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

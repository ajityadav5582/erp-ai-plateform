plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

group = 'com.erp.business'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    // Common-data provides OptimisticLock, TenantScopedEntity, auditing, and base repositories.
    api project(':libraries:common-data')

    // Bikram Sambat conversion, for the derived *_np date columns. The library is
    // deliberately dependency-light (pure JDK core), so it adds no coupling here.
    implementation project(':libraries:common-nepali-date')

    // Spring Data JPA
    api 'org.springframework.data:spring-data-jpa'

    // JPA / Hibernate
    api 'jakarta.persistence:jakarta.persistence-api'
    api 'org.hibernate.orm:hibernate-core'

    // Validation
    api 'jakarta.validation:jakarta.validation-api'

    // Utilities
    api "org.apache.commons:commons-lang3:${commonsLangVersion}"
    api "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // The derived *_np columns are synced by an @PrePersist/@PreUpdate callback, so the
    // guarantee worth pinning down is "the projection always matches the AD date".
    // A plain JUnit test calls that callback directly - no Spring, no database.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.withType(JavaCompile) {
    options.compilerArgs.removeAll { it == '-Xlint:all' }
    options.compilerArgs.addAll(['-Xlint:-processing'])
}

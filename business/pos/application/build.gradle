plugins {
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management'
    id 'java-library'
}

group = 'com.erp.business.pos'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url "https://repo.spring.io/milestone" }
    maven { url "https://repo.spring.io/snapshot" }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    api project(':business:pos:domain')

    // Inventory public contracts (item lookup, outbound stock-issue port).
    implementation project(':business:inventory:interfaces')

    api project(':libraries:common-core')
    api project(':libraries:common-data')
    implementation project(':libraries:common-security')
    implementation project(':libraries:common-nepali-date')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Required by @RequiresPermission / @RequiresRole, enforced by the shared
    // PermissionAspect in libraries:common-security.
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    implementation "org.postgresql:postgresql:${postgresqlVersion}"

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    implementation 'org.springframework.security:spring-security-crypto'

    implementation "org.apache.commons:commons-lang3:${commonsLangVersion}"
    implementation "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:-processing"
}

// Host-side run points at the postgres container published on 5434 by
// compose.development.yml (the in-container port is 5432).
bootRun {
    environment = [
        'POSTGRES_HOST': 'localhost',
        'POSTGRES_PORT': '5434',
        'POSTGRES_DB': 'erpai_platform',
        'POSTGRES_USER': 'erpai',
        'POSTGRES_PASSWORD': 'erpai_dev_password',
        'DB_USERNAME': 'erpai',
        'DB_PASSWORD': 'erpai_dev_password',
        'SPRING_PROFILES_ACTIVE': 'local'
    ]
}

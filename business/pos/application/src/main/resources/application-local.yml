spring:
  main:
    lazy-initialization: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:-localhost}:${POSTGRES_PORT:-5434}/${POSTGRES_DB:-erpai_platform}
    username: ${POSTGRES_USER:-erpai}
    password: ${POSTGRES_PASSWORD:-erpai_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

logging:
  level:
    com.erp.business.pos: DEBUG
    org.hibernate.SQL: DEBUG
